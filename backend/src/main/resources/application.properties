spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/barbershop_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Driver MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate: usiamo 'update' in modo sicuro (se preferisci ricreare tutto da zero in un sol colpo, cambia temporaneamente in 'create')
spring.jpa.hibernate.ddl-auto=update

# Mostra le query SQL nel terminale per debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true